[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-device",
    "crates/forge-profiler",
    "crates/forge-runtime",
    "crates/forge-benchmark",
    "apps/forge-cli",
    "apps/forge-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Verified floor for the libraries and CLI (libloading 0.9 requires 1.88). forge-desktop declares
# its own, higher value because Tauri 2.12 requires 1.90. See DEVELOPMENT.md and the CI "msrv" job.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Corfirean/rdna-forge"

[workspace.dependencies]
anyhow = "1.0"
ash = "0.38"
clap = { version = "4.5", features = ["derive"] }
libloading = "0.9"
naga = { version = "30.0", features = ["wgsl-in", "spv-out"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

forge-core = { path = "crates/forge-core" }
forge-device = { path = "crates/forge-device" }
forge-profiler = { path = "crates/forge-profiler" }
forge-runtime = { path = "crates/forge-runtime" }
forge-benchmark = { path = "crates/forge-benchmark" }
