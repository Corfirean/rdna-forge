# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs it in the "security" job.

[graph]
# The project targets Windows; Linux/macOS targets only appear through Tauri's cross-platform
# dependencies and are still checked, because they are part of Cargo.lock.
all-features = false

[advisories]
# Vulnerabilities fail the check. Unmaintained / yanked crates are surfaced as warnings so that
# transitive crates we cannot upgrade directly (mostly via Tauri) do not block CI, but remain visible.
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Only permissive licenses (plus MPL-2.0, which is file-level copyleft and is pulled in by Tauri's
# HTML/CSS stack) are accepted. Anything else must be reviewed and added here deliberately.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the Tauri tree; warn instead of failing.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
