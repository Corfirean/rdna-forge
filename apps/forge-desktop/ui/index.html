<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDNA Forge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="nav-rail" aria-label="Primary Navigation">
      <div class="brand-header">
        <svg class="brand-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="1" y="1" width="16" height="16" fill="#141517" stroke="#2d3138" stroke-width="1"/>
          <polygon points="3.5,4.5 14.5,4.5 12.8,7.5 3.5,7.5" fill="#c93b3b"/>
          <rect x="6" y="7.5" width="5" height="3.5" fill="#c93b3b"/>
          <rect x="4" y="11.2" width="9.5" height="2.6" fill="#e6e8ec"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">RDNA FORGE</span>
          <span class="brand-version">v0.1.0</span>
        </div>
      </div>

      <nav class="nav-list">
        <button type="button" class="nav-item is-active" data-tab="overview">
          <svg class="nav-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="9" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="9" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="9" y="9" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>Overview</span>
          <span class="nav-key">1</span>
        </button>

        <button type="button" class="nav-item" data-tab="monitor">
          <svg class="nav-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <polyline points="1.5,10.5 4.5,10.5 6.2,4.5 9.2,12.5 11.2,7.5 14.5,7.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
          <span>Monitor</span>
          <span class="nav-key">2</span>
        </button>

        <button type="button" class="nav-item" data-tab="tuning">
          <svg class="nav-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.3"/>
            <rect x="5" y="2.5" width="3" height="3" fill="#1b1d20" stroke="currentColor" stroke-width="1.3"/>
            <line x1="2" y1="8.5" x2="14" y2="8.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="9" y="7" width="3" height="3" fill="#1b1d20" stroke="currentColor" stroke-width="1.3"/>
            <line x1="2" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.3"/>
            <rect x="4" y="11.5" width="3" height="3" fill="#1b1d20" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>Tuning</span>
          <span class="nav-key">3</span>
        </button>

        <button type="button" class="nav-item" data-tab="video">
          <svg class="nav-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="3" width="13" height="10" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <polygon points="6.5,5.5 11,8 6.5,10.5" fill="currentColor"/>
          </svg>
          <span>Video (AMF)</span>
          <span class="nav-key">4</span>
        </button>

        <button type="button" class="nav-item" data-tab="benchmarks">
          <svg class="nav-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2.5" y="8" width="2.5" height="6" fill="currentColor"/>
            <rect x="6.8" y="3" width="2.5" height="11" fill="currentColor"/>
            <rect x="11.1" y="5.5" width="2.5" height="8.5" fill="currentColor"/>
          </svg>
          <span>Benchmarks</span>
          <span class="nav-key">5</span>
        </button>

        <button type="button" class="nav-item" data-tab="llm">
          <svg class="nav-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="6.5" width="12" height="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="10.5" width="8" height="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>LLM Optimizer</span>
          <span class="nav-key">6</span>
        </button>
      </nav>

      <div class="rail-footer">
        <label class="field-label" for="gpu-selector">TARGET ADAPTER</label>
        <select id="gpu-selector" class="select-input mono"></select>
        <div id="rail-meta" class="rail-meta mono">Probing hardware...</div>
      </div>
    </aside>

    <div class="main-column">
      <header class="status-bar">
        <div class="status-bar-left">
          <h1 id="view-title" class="view-title">Overview</h1>
          <span id="status-message" class="status-note"></span>
        </div>
        <div class="status-bar-right">
          <span id="header-device-chip" class="mono muted-text">No device</span>
          <span class="divider-v" aria-hidden="true"></span>
          <span id="polling-indicator" class="polling-badge">
            <span class="dot" aria-hidden="true"></span>
            <span id="polling-text" class="mono">IDLE</span>
          </span>
        </div>
      </header>

      <main id="view-root" class="view-root"></main>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
