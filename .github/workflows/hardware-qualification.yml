name: Hardware Qualification (manual)

# Runs the #[ignore]d GPU correctness tests on a self-hosted Windows runner that has an AMD
# Radeon GPU and current Adrenalin drivers. It is manual-only: GitHub-hosted runners have no GPU,
# so the regular CI workflow cannot and does not claim GPU test results.
#
# Register a self-hosted runner with the labels: self-hosted, windows, amd-gpu.
# The tests are read-only with respect to GPU configuration (ADLX tuning tests only inspect).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gpu-correctness:
    name: GPU correctness tests (self-hosted AMD GPU)
    runs-on: [self-hosted, windows, amd-gpu]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run ignored GPU tests (single-threaded, one GPU context at a time)
        shell: pwsh
        run: |
          cargo test --locked -p forge-cli --test gpu_correctness -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
