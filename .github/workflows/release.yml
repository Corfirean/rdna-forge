name: Release Windows Portable Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to read-only. Only the publish job below is granted write access, and it never
# builds or runs repository code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-release:
    name: Build & Package Windows x64 Portable Release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch tip
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Validate formatting, lints, UI scripts, and offline tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check apps/forge-desktop/ui/app.js
          node --check apps/forge-desktop/ui/views.js
          node --check apps/forge-desktop/ui/charts.js

      - name: Build release binaries
        run: cargo build --release --locked -p forge-cli -p forge-desktop

      - name: Package portable Windows x64 ZIP and SHA-256 checksums
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $bundleName = "RDNA-Forge-$tag-win-x64"
          $stage = Join-Path $env:RUNNER_TEMP $bundleName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target\release\forge.exe" -Destination $stage
          Copy-Item "target\release\forge-desktop.exe" -Destination $stage
          Copy-Item "profiles" -Destination (Join-Path $stage "profiles") -Recurse
          Copy-Item "README.md", "COMPATIBILITY.md", "BENCHMARKS.md", "CHANGELOG.md", "LICENSE" -Destination $stage

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $zipPath = "dist\$bundleName.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          $cliHash = (Get-FileHash "target\release\forge.exe" -Algorithm SHA256).Hash.ToLower()
          $guiHash = (Get-FileHash "target\release\forge-desktop.exe" -Algorithm SHA256).Hash.ToLower()
          @(
            "$zipHash  $bundleName.zip",
            "$cliHash  forge.exe",
            "$guiHash  forge-desktop.exe"
          ) | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ASCII

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rdna-forge-win-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (tags only)
    needs: build-windows-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rdna-forge-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
