name: Release Windows Portable Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-release:
    name: Build & Package Windows x64 Portable Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate formatting, lints, UI scripts, and offline tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          node --check apps/forge-desktop/ui/app.js
          node --check apps/forge-desktop/ui/views.js
          node --check apps/forge-desktop/ui/charts.js

      - name: Build release binaries
        run: cargo build --release -p forge-cli -p forge-desktop

      - name: Package portable Windows x64 ZIP and SHA-256 checksums
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $bundleName = "RDNA-Forge-$tag-win-x64"
          $stage = Join-Path $env:RUNNER_TEMP $bundleName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target\release\forge.exe" -Destination $stage
          Copy-Item "target\release\forge-desktop.exe" -Destination $stage
          Copy-Item "profiles" -Destination (Join-Path $stage "profiles") -Recurse
          Copy-Item "README.md", "COMPATIBILITY.md", "CHANGELOG.md", "LICENSE" -Destination $stage

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $zipPath = "dist\$bundleName.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          $cliHash = (Get-FileHash "target\release\forge.exe" -Algorithm SHA256).Hash.ToLower()
          $guiHash = (Get-FileHash "target\release\forge-desktop.exe" -Algorithm SHA256).Hash.ToLower()
          @(
            "$zipHash  $bundleName.zip",
            "$cliHash  forge.exe",
            "$guiHash  forge-desktop.exe"
          ) | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ASCII

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdna-forge-win-x64
          path: dist/*

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
