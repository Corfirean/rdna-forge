name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "perf/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-ci:
    name: Build, Lint, and Hardware-Independent Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run hardware-independent unit and integration tests
        run: cargo test --workspace

      - name: Setup Node.js for UI syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Desktop UI JavaScript syntax
        run: |
          node --check apps/forge-desktop/ui/app.js
          node --check apps/forge-desktop/ui/views.js
          node --check apps/forge-desktop/ui/charts.js

      - name: Check Python benchmark suite syntax
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: python -m py_compile modules/ai/triton/bench_suite.py
